[project]
name = "resurs-plus-admin"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RET", "PIE", "PT", "TRY", "C4", "PERF",
]
ignore = [
    "E501",   # длинные строки в HTML-шаблонах/error messages
    "B008",   # FastAPI Depends() в дефолтах
    "B904",   # raise-without-from
    "TRY003", # длинные сообщения у HTTPException
    "TRY300", # try-consider-else
    "TRY301", # raise-within-try
    "RET504", # unnecessary-assign-before-return
    "SIM108", # тернарник не всегда читаемее
    "UP042",  # str+Enum mixin → StrEnum: рискованно для SQLAdmin
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["models", "forms", "metrics", "yandex_metrika", "views", "actions"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true

warn_return_any = false           # SQLAlchemy execute().scalars() возвращает Any
disallow_subclassing_any = false  # SQLAdmin BaseView/ModelView
disallow_any_decorated = false    # @expose декораторы возвращают Any

# После миграции на Mapped[X] почти все Column-style проблемы ушли.
# Оставшиеся коды — SQLAlchemy stubs и dict(rows) issues.
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = ["sqladmin.*", "starlette.*", "wtforms.*", "markupsafe.*", "httpx.*", "psycopg2.*", "forms"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# В views/* используется паттерн SQLAdmin column_formatters: словарь {Column: lambda m, a: ...}.
# Mypy не выводит тип `m` (без аннотации он становится `type`) и ругается на `m.<attr>`.
# Чтобы строго затипизировать каждую лямбду — нужны cast или явные signature, что заваливает читаемость.
# Раз это конвенция фреймворка, отключаем точечно.
module = "views.*"
disable_error_code = ["attr-defined"]
