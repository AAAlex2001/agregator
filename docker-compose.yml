services:
  postgres:
    image: postgres:15-alpine
    container_name: agregator-postgres
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "random_page_cost=1.1"
    environment:
      POSTGRES_DB: agregator_db
      POSTGRES_USER: agregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - agregator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agregator -d agregator_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: agregator-redis
    command:
      - "redis-server"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - agregator-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://agregator:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agregator_db
      REDIS_URL: redis://redis:6379/0
      ECHO_SQL: ${ECHO_SQL:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-30}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      UNISENDER_GO_API_KEY: ${UNISENDER_GO_API_KEY}
      UNISENDER_GO_ENDPOINT: ${UNISENDER_GO_ENDPOINT}
      DADATA_API_KEY: ${DADATA_API_KEY}
      DADATA_SECRET_KEY: ${DADATA_SECRET_KEY}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agregator-network
    deploy:
      replicas: 2

  nginx:
    image: nginx:alpine
    container_name: agregator-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/plus-resurs.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/plus-resurs.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - backend_uploads:/app/uploads:ro
      - nginx_image_cache:/var/cache/nginx/images
    depends_on:
      - frontend
      - backend
      - admin
    restart: unless-stopped
    networks:
      - agregator-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: agregator-admin
    environment:
      DATABASE_URL: postgresql+asyncpg://agregator:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agregator_db
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_SECRET: ${ADMIN_SECRET:-supersecretkey-change-me}
      DADATA_API_KEY: ${DADATA_API_KEY}
      DADATA_SECRET_KEY: ${DADATA_SECRET_KEY}
      YANDEX_METRIKA_OAUTH_TOKEN: ${YANDEX_METRIKA_OAUTH_TOKEN:-}
      YANDEX_METRIKA_COUNTER_ID: ${YANDEX_METRIKA_COUNTER_ID:-108708847}
    expose:
      - "8001"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agregator-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agregator-frontend
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - agregator-network

networks:
  agregator-network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  nginx_image_cache:
