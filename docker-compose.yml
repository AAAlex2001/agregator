services:
  postgres:
    image: postgres:15-alpine
    container_name: agregator-postgres
    environment:
      POSTGRES_DB: agregator_db
      POSTGRES_USER: agregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - agregator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agregator -d agregator_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agregator-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://agregator:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agregator_db
      ECHO_SQL: ${ECHO_SQL:-false}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agregator-network

  nginx:
    image: nginx:alpine
    container_name: agregator-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/plus-resurs.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/plus-resurs.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - agregator-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agregator-frontend
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - agregator-network

networks:
  agregator-network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:



