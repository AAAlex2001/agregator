services:
  postgres:
    image: postgres:15-alpine
    container_name: agregator-postgres
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "random_page_cost=1.1"
    environment:
      POSTGRES_DB: agregator_db
      POSTGRES_USER: agregator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monitoring/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - agregator-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agregator -d agregator_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agregator-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://agregator:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agregator_db
      ECHO_SQL: ${ECHO_SQL:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_COMMAND_TIMEOUT: ${DB_COMMAND_TIMEOUT:-30}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
      UNISENDER_GO_API_KEY: ${UNISENDER_GO_API_KEY}
      UNISENDER_GO_ENDPOINT: ${UNISENDER_GO_ENDPOINT}
      DADATA_API_KEY: ${DADATA_API_KEY}
      DADATA_SECRET_KEY: ${DADATA_SECRET_KEY}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agregator-network

  nginx:
    image: nginx:alpine
    container_name: agregator-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/plus-resurs.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/plus-resurs.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - backend_uploads:/app/uploads:ro
      - nginx_image_cache:/var/cache/nginx/images
    depends_on:
      - frontend
      - backend
      - admin
    restart: unless-stopped
    networks:
      - agregator-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: agregator-admin
    environment:
      DATABASE_URL: postgresql+asyncpg://agregator:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agregator_db
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_SECRET: ${ADMIN_SECRET:-supersecretkey-change-me}
      DADATA_API_KEY: ${DADATA_API_KEY}
      DADATA_SECRET_KEY: ${DADATA_SECRET_KEY}
    expose:
      - "8001"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agregator-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agregator-frontend
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - agregator-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agregator-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - cadvisor
      - node-exporter
    restart: unless-stopped
    networks:
      - agregator-network

  grafana:
    image: grafana/grafana:11.2.2
    container_name: agregator-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://176.57.215.114:3000}
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - agregator-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: agregator-cadvisor
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped
    networks:
      - agregator-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: agregator-node-exporter
    command:
      - "--path.rootfs=/host"
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    networks:
      - agregator-network

  k6:
    image: grafana/k6:0.53.0
    container_name: agregator-k6
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep 3600; done"]
    volumes:
      - ./monitoring/k6/scripts:/scripts
    environment:
      BASE_URL: ${K6_BASE_URL:-http://176.57.215.114}
    restart: unless-stopped
    networks:
      - agregator-network

networks:
  agregator-network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  prometheus_data:
  grafana_data:
  nginx_image_cache:



