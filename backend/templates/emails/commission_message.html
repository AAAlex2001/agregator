{% extends "base.html" %}

{% block preheader %}{{ title }}{% endblock %}

{% block content %}
<p style="margin: 0 0 12px 0; font-size: 12px; line-height: 16px; color: #FF8A00; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;">
  Конкурсная комиссия
</p>
<h1 style="margin: 0 0 12px 0; font-size: 26px; line-height: 34px; font-weight: 700; color: #0F172A; letter-spacing: -0.5px;">
  {{ title }}
</h1>
<p style="margin: 0; font-size: 15px; line-height: 24px; color: #475569; white-space: pre-wrap;">{{ message }}</p>
{% endblock %}
