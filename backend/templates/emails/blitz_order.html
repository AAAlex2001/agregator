{% extends "base.html" %}

{% block preheader %}{{ message }}{% endblock %}

{% block content %}
<p style="margin: 0 0 12px 0; font-size: 12px; line-height: 16px; color: #FF8A00; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;">
  Блиц-эксперт
</p>
<h1 style="margin: 0 0 12px 0; font-size: 26px; line-height: 34px; font-weight: 700; color: #0F172A; letter-spacing: -0.5px;">
  {{ title }}
</h1>
<p style="margin: 0 0 28px 0; font-size: 15px; line-height: 24px; color: #475569; white-space: pre-wrap;">{{ message }}</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ cta_url }}" style="height:44px;v-text-anchor:middle;width:220px;" arcsize="18%" stroke="f" fillcolor="#0F172A">
        <w:anchorlock/>
        <center style="color:#ffffff;font-family:sans-serif;font-size:14px;font-weight:600;">Открыть заявку</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="{{ cta_url }}" style="display: inline-block; padding: 12px 28px; background: #0F172A; color: #FFFFFF; font-size: 14px; font-weight: 600; line-height: 20px; text-decoration: none; border-radius: 8px;">Открыть заявку</a>
      <!--<![endif]-->
    </td>
  </tr>
</table>
{% endblock %}
