{% extends "base.html" %}

{% block preheader %}{{ heading }}{% endblock %}

{% block content %}
<p style="margin: 0 0 12px 0; font-size: 12px; line-height: 16px; color: #FF8A00; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;">
  Контакты экспертов
</p>
<h1 style="margin: 0 0 12px 0; font-size: 26px; line-height: 34px; font-weight: 700; color: #0F172A;">
  {{ heading }}
</h1>
<p style="margin: 0 0 28px 0; font-size: 15px; line-height: 24px; color: #475569;">
  Здравствуйте, {{ recipient_greeting }}. {{ message }}
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td>
      <a href="{{ cta_url }}" style="display: inline-block; padding: 12px 28px; background: #FF8A00; color: #FFFFFF; font-size: 14px; font-weight: 600; line-height: 20px; text-decoration: none; border-radius: 8px;">Открыть сделку</a>
    </td>
  </tr>
</table>
{% endblock %}
