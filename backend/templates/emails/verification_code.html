{% extends "base.html" %}
{% block content %}
<h1 style="margin:0 0 12px 0;font-size:22px;line-height:28px;font-weight:600;color:#1A1A1A;">{{ heading }}</h1>
<p style="margin:0 0 20px 0;font-size:14px;line-height:22px;color:#4A4F57;">{{ intro }}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;">
  <tr>
    <td style="padding:22px 24px;border:1px solid #FFDDA9;border-radius:12px;background:#FFF7EC;text-align:center;">
      <p style="margin:0 0 8px 0;font-size:12px;line-height:16px;color:#8A8F99;text-transform:uppercase;letter-spacing:0.4px;">Код подтверждения</p>
      <p style="margin:0;font-size:34px;line-height:40px;font-weight:700;letter-spacing:8px;color:#FF8A00;font-variant-numeric:tabular-nums;">{{ code }}</p>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:13px;line-height:20px;color:#8A8F99;">
  Код действителен {{ expire_minutes }} минут. Если вы не запрашивали подтверждение — просто проигнорируйте это письмо.
</p>
{% endblock %}
