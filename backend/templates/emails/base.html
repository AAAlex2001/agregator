<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <title>{{ subject }}</title>
  <!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->
  <style>
    html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; background: #FFFFFF; }
    * { -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt !important; mso-table-rspace: 0pt !important; }
    table { border-spacing: 0 !important; border-collapse: collapse !important; table-layout: fixed !important; margin: 0 auto !important; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    a { text-decoration: none; color: #0F172A; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    @media screen and (max-width: 600px) {
      .email-container { width: 100% !important; }
      .email-section { padding-left: 24px !important; padding-right: 24px !important; }
      .kv-label, .kv-value { display: block !important; width: 100% !important; text-align: left !important; padding: 0 !important; }
      .kv-label { padding-top: 10px !important; padding-bottom: 2px !important; }
      .kv-value { padding-bottom: 10px !important; border-bottom: 1px solid #EEF0F2 !important; }
      .kv-row-last .kv-value { border-bottom: 0 !important; }
    }
  </style>
</head>
<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0F172A;">
<center role="article" aria-roledescription="email" lang="ru" style="width: 100%; background: #FFFFFF;">

  <div style="display: none; font-size: 1px; line-height: 1px; max-height: 0; max-width: 0; opacity: 0; overflow: hidden; mso-hide: all;">
    {% block preheader %}{{ subject }}{% endblock %}
    &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>

  <div style="max-width: 560px; margin: 0 auto;" class="email-container">
    <!--[if mso]>
    <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" width="560">
    <tr><td>
    <![endif]-->

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 560px; margin: 0 auto;">

      <tr>
        <td class="email-section" style="padding: 48px 40px 28px 40px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td align="left" valign="middle" style="font-size: 15px; font-weight: 700; color: #0F172A; letter-spacing: -0.2px;">
                Ресурс-Плюс
              </td>
              <td align="right" valign="middle" style="font-size: 12px; line-height: 16px; color: #94A3B8;">
                <a href="https://plus-resurs.com" style="color: #94A3B8; text-decoration: none;">plus-resurs.com</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td class="email-section" style="padding: 0 40px;">
          <div style="height: 1px; background: #E2E8F0; line-height: 1px; font-size: 0;">&nbsp;</div>
        </td>
      </tr>

      <tr>
        <td class="email-section" style="padding: 32px 40px 40px 40px;">
          {% block content %}{% endblock %}
        </td>
      </tr>

      <tr>
        <td class="email-section" style="padding: 0 40px;">
          <div style="height: 1px; background: #E2E8F0; line-height: 1px; font-size: 0;">&nbsp;</div>
        </td>
      </tr>

      <tr>
        <td class="email-section" style="padding: 20px 40px 48px 40px; font-size: 12px; line-height: 18px; color: #94A3B8;">
          {% block footer %}
          Автоматическое письмо от Ресурс-Плюс. <a href="https://plus-resurs.com/settings" style="color: #94A3B8; text-decoration: underline;">Управление уведомлениями</a>.
          {% endblock %}
        </td>
      </tr>

    </table>

    <!--[if mso]></td></tr></table><![endif]-->
  </div>

</center>
</body>
</html>
