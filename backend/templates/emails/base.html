<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{ subject }}</title>
  <style>
    /* Минимальные правила-фоллбэки. Основные стили — inline. */
    body { margin: 0; padding: 0; background: #F5F6F8; }
    table { border-collapse: collapse; }
    img { border: 0; outline: none; text-decoration: none; display: block; }
    a { color: #FF8A00; }
    @media (max-width: 560px) {
      .email-card { width: 100% !important; border-radius: 0 !important; }
      .email-section { padding-left: 20px !important; padding-right: 20px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#1A1A1A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F5F6F8;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" class="email-card" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:560px;background:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(17,24,39,0.05);">
          <tr>
            <td class="email-section" style="padding:24px 32px;border-bottom:1px solid #F0F0F2;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="left" style="font-size:18px;font-weight:700;color:#1A1A1A;letter-spacing:-0.2px;">
                    <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#FF8A00;vertical-align:middle;margin-right:8px;"></span>
                    Ресурс-Плюс
                  </td>
                  <td align="right" style="font-size:12px;color:#8A8F99;">
                    plus-resurs.com
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td class="email-section" style="padding:28px 32px 24px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td class="email-section" style="padding:20px 32px;background:#FAFAFB;border-top:1px solid #F0F0F2;font-size:12px;line-height:18px;color:#8A8F99;">
              {% block footer %}
              <p style="margin:0 0 4px 0;">Это автоматическое письмо с платформы Ресурс-Плюс. Отвечать на него не нужно.</p>
              <p style="margin:0;">Настроить уведомления можно в профиле: <a href="https://plus-resurs.com/settings" style="color:#FF8A00;text-decoration:none;">plus-resurs.com/settings</a></p>
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
