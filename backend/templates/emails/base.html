<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <title>{{ subject }}</title>
  <!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->
  <style>
    html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; background: #FFFFFF; }
    * { -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt !important; mso-table-rspace: 0pt !important; }
    table { border-spacing: 0 !important; border-collapse: separate; margin: 0 auto; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    a { color: #2B2F33; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    @media screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .section { padding-left: 16px !important; padding-right: 16px !important; }
      .h1 { font-size: 28px !important; line-height: 34px !important; }
      .h2 { font-size: 24px !important; line-height: 30px !important; }
      .hero, .card { padding: 24px 20px !important; }
      .hero-title { font-size: 24px !important; line-height: 30px !important; }
      .logo { width: 150px !important; height: auto !important; }
      .footer-link { display: inline-block !important; padding: 6px 10px !important; font-size: 16px !important; }
    }
  </style>
</head>
<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background: #FFFFFF; font-family: Arial, Tahoma, Verdana, sans-serif; color: #2B2F33;">
<center role="article" aria-roledescription="email" lang="ru" style="width: 100%; background: #FFFFFF;">

  <div style="display: none; font-size: 1px; line-height: 1px; max-height: 0; max-width: 0; opacity: 0; overflow: hidden; mso-hide: all;">
    {% block preheader %}{{ subject }}{% endblock %}
    &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>

  <div style="max-width: 600px; margin: 0 auto;" class="email-container">
    <!--[if mso]>
    <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" width="600">
    <tr><td>
    <![endif]-->

    <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="max-width: 600px; margin: 0 auto;">

      <tr>
        <td class="section" style="padding: 36px 20px 32px 20px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td align="left" valign="middle">
                <a href="https://plus-resurs.com" target="_blank" style="text-decoration: none;">
                  <img class="logo" src="https://plus-resurs.com/email/logo.png" width="190" height="27" alt="Ресурс-Плюс" style="display: block; width: 190px; height: 27px; font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; color: #2B2F33;">
                </a>
              </td>
              <td align="right" valign="middle">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 0 auto;">
                  <tr>
                    <td style="border-radius: 8px; background: #2B2F33;">
                      <a href="https://plus-resurs.com/settings" target="_blank" style="display: inline-block; padding: 14px 24px; font-family: Arial, Tahoma, Verdana, sans-serif; font-size: 15px; line-height: 18px; color: #FFFFFF; text-decoration: none; border-radius: 8px;">Войти</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td class="section" style="padding: 0 20px 24px 20px;">
          {% block content %}{% endblock %}
        </td>
      </tr>

      <tr>
        <td class="section" style="padding: 24px 20px 0 20px;">
          <div style="height: 1px; background: #E5E7EB; line-height: 1px; font-size: 0;">&nbsp;</div>
        </td>
      </tr>

      <tr>
        <td class="section" align="center" style="padding: 40px 20px 16px 20px; font-family: Arial, Tahoma, Verdana, sans-serif;">
          <a class="footer-link" href="https://plus-resurs.com/posts" target="_blank" style="display: inline-block; padding: 6px 16px; font-size: 20px; line-height: 26px; color: #2B2F33; text-decoration: none;">Публикации</a>
          <a class="footer-link" href="https://plus-resurs.com/news" target="_blank" style="display: inline-block; padding: 6px 16px; font-size: 20px; line-height: 26px; color: #2B2F33; text-decoration: none;">Новости</a>
          <a class="footer-link" href="https://plus-resurs.com/blog" target="_blank" style="display: inline-block; padding: 6px 16px; font-size: 20px; line-height: 26px; color: #2B2F33; text-decoration: none;">Блог</a>
          <a class="footer-link" href="https://plus-resurs.com/support" target="_blank" style="display: inline-block; padding: 6px 16px; font-size: 20px; line-height: 26px; color: #2B2F33; text-decoration: none;">Помощь</a>
        </td>
      </tr>

      <tr>
        <td class="section" align="center" style="padding: 16px 20px 16px 20px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
            <tr>
              <td style="padding: 0 4px;">
                <a href="https://plus-resurs.com/settings?section=notifications" target="_blank" style="display: inline-block; padding: 10px 16px; background: #F2F4F7; border-radius: 8px; font-family: Arial, Tahoma, Verdana, sans-serif; font-size: 13px; line-height: 16px; font-weight: 700; color: #6B7280; text-decoration: none;">Настроить уведомления</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      <tr>
        <td class="section" align="center" style="padding: 8px 20px 48px 20px; font-family: Arial, Tahoma, Verdana, sans-serif; font-size: 12px; line-height: 18px; color: #9CA3AF;">
          {% block footer_note %}Автоматическое письмо от площадки «Ресурс-Плюс» — отвечать на него не нужно.{% endblock %}
        </td>
      </tr>

    </table>

    <!--[if mso]></td></tr></table><![endif]-->
  </div>

</center>
</body>
</html>
