<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{% endblock %}</title>
  <style>
    @page { size: A4; margin: 15mm; }
    body { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 9pt; line-height: 1.35; color: #111; }
    h1 { font-size: 14pt; margin: 14px 0 8px; }
    table { width: 100%; border-collapse: collapse; }
    .requisites td { padding: 2px 0; vertical-align: top; }
    .requisites td.label { width: 45mm; color: #555; font-size: 8pt; }
    .items th, .items td { border: 0.5pt solid #b9bdc7; padding: 5px; }
    .items th { background: #f3f4f6; text-align: left; }
    .items .number { text-align: right; white-space: nowrap; }
    .totals td { padding: 2px 0; text-align: right; }
    .totals td.value { width: 30mm; }
    .strong { font-weight: bold; }
    .small { font-size: 8pt; color: #555; }
    .signature { margin-top: 22px; }
    .signature td { padding: 0; vertical-align: bottom; }
    .signature .line { border-bottom: 0.5pt solid #b9bdc7; width: 70mm; }
    .signature .name { text-align: right; }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
